name: PRODUCT-DATA-7 Flue Exact199 Public Carrier R2

on:
  push:
    branches:
      - product-data-7-flue-exact199-r1-carrier
    paths:
      - ".github/workflows/product-data-7-flue-exact199-r1-carrier.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIVATE_SSOT: nalsur0609/PROGRAMMA_PODBORA_STOUT_SANDBOX
  PRIVATE_HEAD: b8ae3e304895e37e00c374ac0ffa06dbebfd09f2
  ARTIFACT_RETENTION: NONE

jobs:
  exact_head_gate:
    name: Flue exact199 private-action deterministic gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Public carrier provenance
        shell: bash
        run: |
          set -euo pipefail
          echo "PUBLIC_CI_CARRIER=nalsur0609/1234"
          echo "PRIVATE_SSOT=$PRIVATE_SSOT"
          echo "PRIVATE_HEAD=$PRIVATE_HEAD"
          echo "PRIVATE_ACTION_REF=$PRIVATE_HEAD"
          echo "ARTIFACT_RETENTION=$ARTIFACT_RETENTION"
          echo "PUBLIC_STOUT_ARTIFACT_UPLOAD=NONE"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Execute pinned private exact-head evidence gate
        uses: nalsur0609/PROGRAMMA_PODBORA_STOUT_SANDBOX/.github/actions/product-data-7-flue-exact199-carrier@b8ae3e304895e37e00c374ac0ffa06dbebfd09f2

      - name: Carrier boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "PRIVATE_HEAD=b8ae3e304895e37e00c374ac0ffa06dbebfd09f2"
          echo "ARTIFACT_RETENTION=NONE"
          echo "PUBLIC_STOUT_SOURCE_COPY=NONE"
          echo "PRODUCT_DATA_FLUE_EXACT199_PUBLIC_CARRIER=PASS"
