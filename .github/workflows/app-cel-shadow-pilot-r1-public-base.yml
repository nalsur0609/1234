name: APP-CEL-1 public compute carrier R1

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIVATE_REPO: nalsur0609/PROGRAMMA_PODBORA_DEV2_SANDBOX
  PRIVATE_HEAD: 562092c486903bdacdc76d1ad922b23e8ca87c2a
  TASK_BASE: 70bf3eae906102dc003f7f06cd7a8bdd32515589

jobs:
  web_shadow:
    name: Web exact-head CEL shadow
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      manifest_sha256: ${{ steps.shadow.outputs.manifest_sha256 }}
      manifest_count: ${{ steps.shadow.outputs.manifest_count }}
      current_sha256: ${{ steps.shadow.outputs.current_sha256 }}
      cel_sha256: ${{ steps.shadow.outputs.cel_sha256 }}
      parity_percent: ${{ steps.shadow.outputs.parity_percent }}
      unsafe_count: ${{ steps.shadow.outputs.unsafe_count }}
      false_reject_count: ${{ steps.shadow.outputs.false_reject_count }}
      fail_closed: ${{ steps.shadow.outputs.fail_closed }}
      deterministic: ${{ steps.shadow.outputs.deterministic }}
    services:
      meilisearch:
        image: getmeili/meilisearch:v1.54.0
        env:
          MEILI_MASTER_KEY: app-cel-shadow-public-r1-key
          MEILI_NO_ANALYTICS: "true"
        ports:
          - 7700:7700
    env:
      APP_CORE_MEILI_URL: http://127.0.0.1:7700
      APP_CORE_MEILI_MASTER_KEY: app-cel-shadow-public-r1-key
      APP_WEB_HOST: 127.0.0.1
      APP_WEB_PORT: "8765"

    steps:
      - name: Checkout exact private DEV2 head
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ env.PRIVATE_HEAD }}
          token: ${{ secrets.DEV2_READ_TOKEN }}
          path: private-app
          fetch-depth: 0

      - name: Verify exact private identity
        working-directory: private-app
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$PRIVATE_HEAD"
          test "$(git merge-base "$TASK_BASE" HEAD)" = "$TASK_BASE"
          test "$(git rev-list --count "HEAD..$TASK_BASE")" = "0"
          echo "PRIVATE_EXACT_HEAD=$actual"
          echo "TASK_BASE=$TASK_BASE"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          cache-dependency-path: private-app/APP_CORE_R3_PILOT/cel_shadow_r1/go.sum

      - name: Build CEL-go shadow
        working-directory: private-app/APP_CORE_R3_PILOT/cel_shadow_r1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin
          CGO_ENABLED=0 go build -trimpath -o bin/app-cel-shadow-r1 .
          ./bin/app-cel-shadow-r1 </dev/null | head -n 1

      - name: Install accepted Web dependencies
        working-directory: private-app
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "jsonschema==4.25.1"
          python -m pip install --disable-pip-version-check --require-hashes -r PILOT_READY/units_engine/requirements-r1.lock
          python -m pip install --disable-pip-version-check -r tools/pdf_factory_r1/requirements-r1.txt

      - name: Accepted current matcher plus shadow regressions
        working-directory: private-app
        shell: bash
        run: |
          set -euo pipefail
          python APP_CORE_R3_PILOT/tests/test_machine_selection_r1.py
          python APP_CORE_R3_PILOT/tests/test_machine_selection_profile_conflict_r1.py
          python APP_CORE_R3_PILOT/tests/test_stout_ball_valve_114_adapter_r1.py
          python APP_CORE_R3_PILOT/tests/test_stout_ready_1543_shared_core_r1.py
          python APP_CORE_R3_PILOT/tests/test_cel_shadow_pilot_r1.py

      - name: Start accepted Web shared runtime
        working-directory: private-app
        shell: bash
        run: |
          set -euo pipefail
          export APP_CORE_NODE_BINARY="$(command -v node)"
          export APP_CORE_BUILD_HEAD="$PRIVATE_HEAD"
          python APP_CORE_R3_PILOT/web_runtime.py > "$RUNNER_TEMP/web-app-cel-shadow.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/web-app-cel-shadow.pid"
          ok=0
          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8765/ready > "$RUNNER_TEMP/web-app-cel-ready.json" 2>/dev/null; then
              ok=1
              break
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/web-app-cel-shadow.pid")" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            cat "$RUNNER_TEMP/web-app-cel-shadow.log" || true
            exit 1
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          value=json.loads(Path(os.environ["RUNNER_TEMP"]).joinpath("web-app-cel-ready.json").read_text(encoding="utf-8"))
          assert value.get("ready") is True, value
          assert int(value["machine_selection"]["auto_selection_ready_count"]) == 1031
          print("WEB_SHARED_RUNTIME=PASS")
          PY

      - name: Run committed pilot corpus
        id: shadow
        working-directory: private-app
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/app-cel-shadow-web-evidence"
          summary="$RUNNER_TEMP/app-cel-shadow-web-summary.json"
          python APP_CORE_R3_PILOT/cel_shadow_r1/shadow.py             --binary APP_CORE_R3_PILOT/cel_shadow_r1/bin/app-cel-shadow-r1             --evidence-dir "$evidence"             --summary-out "$summary"
          python - <<'PY'
          import json, os
          from pathlib import Path
          s=json.loads(Path(os.environ["RUNNER_TEMP"]).joinpath("app-cel-shadow-web-summary.json").read_text(encoding="utf-8"))
          p=s["parity"]
          assert s["status"] == "PASS"
          assert p["decision_parity_percent"] == 100.0
          assert p["unsafe_selection_count"] == 0
          assert p["false_reject_count"] == 0
          assert p["fail_closed_parity"] is True
          assert s["deterministic_repeat_pass"] is True
          print(json.dumps({
              "platform":"web",
              "private_head":os.environ["PRIVATE_HEAD"],
              "manifest_count":s["manifest_count"],
              "manifest_sha256":s["manifest_sha256"],
              "current_ledger_sha256":s["current_ledger_sha256"],
              "cel_ledger_sha256":s["cel_ledger_sha256"],
              "decision_parity_percent":p["decision_parity_percent"],
              "unsafe_selection_count":p["unsafe_selection_count"],
              "false_reject_count":p["false_reject_count"],
              "fail_closed_parity":p["fail_closed_parity"],
              "deterministic_repeat_pass":s["deterministic_repeat_pass"],
              "trace_comparators":s["trace_comparators"],
              "performance":s["performance"],
          },ensure_ascii=False,sort_keys=True))
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write(f"manifest_sha256={s['manifest_sha256']}\n")
              f.write(f"manifest_count={s['manifest_count']}\n")
              f.write(f"current_sha256={s['current_ledger_sha256']}\n")
              f.write(f"cel_sha256={s['cel_ledger_sha256']}\n")
              f.write(f"parity_percent={p['decision_parity_percent']}\n")
              f.write(f"unsafe_count={p['unsafe_selection_count']}\n")
              f.write(f"false_reject_count={p['false_reject_count']}\n")
              f.write(f"fail_closed={str(p['fail_closed_parity']).lower()}\n")
              f.write(f"deterministic={str(s['deterministic_repeat_pass']).lower()}\n")
          PY

      - name: Stop Web runtime
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/web-app-cel-shadow.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/web-app-cel-shadow.pid")" 2>/dev/null || true
          fi

  windows_shadow:
    name: Windows Owner offline exact-head CEL shadow
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      manifest_sha256: ${{ steps.shadow.outputs.manifest_sha256 }}
      manifest_count: ${{ steps.shadow.outputs.manifest_count }}
      current_sha256: ${{ steps.shadow.outputs.current_sha256 }}
      cel_sha256: ${{ steps.shadow.outputs.cel_sha256 }}
      parity_percent: ${{ steps.shadow.outputs.parity_percent }}
      unsafe_count: ${{ steps.shadow.outputs.unsafe_count }}
      false_reject_count: ${{ steps.shadow.outputs.false_reject_count }}
      fail_closed: ${{ steps.shadow.outputs.fail_closed }}
      deterministic: ${{ steps.shadow.outputs.deterministic }}

    steps:
      - name: Checkout exact private DEV2 head
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ env.PRIVATE_HEAD }}
          token: ${{ secrets.DEV2_READ_TOKEN }}
          path: private-app
          fetch-depth: 0

      - name: Preserve exact Git bytes and verify identity
        working-directory: private-app
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git clean -fdx
          $actual=(git rev-parse HEAD).Trim()
          if ($actual -ne $env:PRIVATE_HEAD) { throw "PRIVATE_EXACT_HEAD_MISMATCH:$actual" }
          $mergeBase=(git merge-base $env:TASK_BASE HEAD).Trim()
          if ($mergeBase -ne $env:TASK_BASE) { throw "TASK_BASE_MERGE_BASE_MISMATCH:$mergeBase" }
          Write-Host "PRIVATE_EXACT_HEAD=$actual"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          cache-dependency-path: private-app/APP_CORE_R3_PILOT/cel_shadow_r1/go.sum

      - name: Build Windows CEL-go shadow
        working-directory: private-app/APP_CORE_R3_PILOT/cel_shadow_r1
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          New-Item -ItemType Directory -Force bin | Out-Null
          $env:CGO_ENABLED="0"
          go build -trimpath -o bin/app-cel-shadow-r1.exe .
          if ($LASTEXITCODE -ne 0) { throw "CEL_GO_BUILD_FAILED" }

      - name: Source regressions
        working-directory: private-app
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          python APP_CORE_R3_PILOT/tests/test_machine_selection_r1.py
          python APP_CORE_R3_PILOT/tests/test_machine_selection_profile_conflict_r1.py
          python APP_CORE_R3_PILOT/tests/test_stout_ball_valve_114_adapter_r1.py
          python APP_CORE_R3_PILOT/tests/test_stout_ready_1543_shared_core_r1.py
          python APP_CORE_R3_PILOT/tests/test_cel_shadow_pilot_r1.py

      - name: Materialize pinned Owner runtime at build time
        working-directory: private-app
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $rt=Join-Path $PWD "runtime_input"
          New-Item -ItemType Directory -Force "$rt/python","$rt/node","$rt/meilisearch" | Out-Null
          $pyUrl="https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip"
          $pyZip=Join-Path $env:RUNNER_TEMP "python-3.12.10-embed-amd64.zip"
          Invoke-WebRequest -Uri $pyUrl -OutFile $pyZip
          $pySha=(Get-FileHash $pyZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($pySha -ne "4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3") { throw "PYTHON_SHA256_MISMATCH:$pySha" }
          Expand-Archive $pyZip "$rt/python" -Force
          $pth=Get-ChildItem "$rt/python" -Filter "python*._pth" | Select-Object -First 1
          if (-not $pth) { throw "PYTHON_EMBED_PTH_MISSING" }
          (Get-Content $pth.FullName) -replace '^#import site$','import site' | Set-Content $pth.FullName -Encoding ascii

          $getPip=Join-Path $env:RUNNER_TEMP "get-pip.py"
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile $getPip
          & "$rt/python/python.exe" $getPip --disable-pip-version-check
          if ($LASTEXITCODE -ne 0) { throw "GET_PIP_FAILED" }

          $nodeVersion="22.23.3"
          $nodeName="node-v$nodeVersion-win-x64.zip"
          $nodeBase="https://nodejs.org/download/release/v$nodeVersion"
          $nodeZip=Join-Path $env:RUNNER_TEMP $nodeName
          $sums=Join-Path $env:RUNNER_TEMP "node-SHASUMS256.txt"
          Invoke-WebRequest -Uri "$nodeBase/$nodeName" -OutFile $nodeZip
          Invoke-WebRequest -Uri "$nodeBase/SHASUMS256.txt" -OutFile $sums
          $expectedLine=Get-Content $sums | Where-Object { $_ -match [regex]::Escape($nodeName) } | Select-Object -First 1
          if (-not $expectedLine) { throw "NODE_OFFICIAL_SHA_NOT_FOUND" }
          $nodeExpected=($expectedLine -split '\s+')[0].ToLowerInvariant()
          $nodeSha=(Get-FileHash $nodeZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($nodeSha -ne $nodeExpected) { throw "NODE_SHA256_MISMATCH" }
          $nodeTmp=Join-Path $env:RUNNER_TEMP "node-unpack"
          Expand-Archive $nodeZip $nodeTmp -Force
          $nodeExe=Get-ChildItem $nodeTmp -Recurse -Filter node.exe | Select-Object -First 1
          if (-not $nodeExe) { throw "NODE_EXE_MISSING" }
          Copy-Item $nodeExe.FullName "$rt/node/node.exe"

          $meili="$rt/meilisearch/meilisearch-windows-amd64.exe"
          Invoke-WebRequest -Uri "https://github.com/meilisearch/meilisearch/releases/download/v1.54.0/meilisearch-windows-amd64.exe" -OutFile $meili
          $meiliSha=(Get-FileHash $meili -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($meiliSha -ne "1a3a3f2fa249b2a471eca479d37b1d3bbb9bda1aacae3eaf7839218105810125") { throw "MEILI_SHA256_MISMATCH:$meiliSha" }

      - name: Build fresh Owner package
        working-directory: private-app
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          & "runtime_input/python/python.exe" "release/issue_199/build_owner_package_stout_1031_r1.py" --repo-root "$PWD" --offline-runtime-root "$PWD/runtime_input" --output "$env:RUNNER_TEMP/APP_CEL_SHADOW_OWNER_R1" --build-head $env:PRIVATE_HEAD --zip
          if ($LASTEXITCODE -ne 0) { throw "OWNER_PACKAGE_BUILD_FAILED" }

      - name: Fresh extract and run shadow offline
        id: shadow
        working-directory: private-app
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $fresh=Join-Path $env:RUNNER_TEMP "app-cel-shadow-owner-fresh"
          if (Test-Path $fresh) { Remove-Item $fresh -Recurse -Force }
          Expand-Archive "$env:RUNNER_TEMP/APP_CEL_SHADOW_OWNER_R1.zip" $fresh
          $py=Join-Path $fresh "runtime/python/python.exe"
          $cel=Join-Path $fresh "APP_CORE_R3_PILOT/cel_shadow_r1/bin/app-cel-shadow-r1.exe"
          if (-not (Test-Path $cel)) { throw "PACKAGE_CEL_BINARY_MISSING" }

          $env:PIP_NO_INDEX="1"
          $env:PIP_DISABLE_PIP_VERSION_CHECK="1"
          $env:PYTHONNOUSERSITE="1"
          $env:NO_PROXY="*"
          $evidence=Join-Path $env:RUNNER_TEMP "windows-cel-shadow-evidence"
          $summary=Join-Path $env:RUNNER_TEMP "windows-cel-shadow-summary.json"
          & $py (Join-Path $fresh "APP_CORE_R3_PILOT/cel_shadow_r1/shadow.py") --binary $cel --evidence-dir $evidence --summary-out $summary
          if ($LASTEXITCODE -ne 0) { throw "WINDOWS_SHADOW_FAILED" }
          $s=Get-Content $summary -Raw | ConvertFrom-Json
          if ($s.status -ne "PASS") { throw "WINDOWS_SHADOW_STATUS_NOT_PASS" }
          if ([double]$s.parity.decision_parity_percent -ne 100.0) { throw "WINDOWS_PARITY_NOT_100" }
          if ([int]$s.parity.unsafe_selection_count -ne 0) { throw "WINDOWS_UNSAFE_NONZERO" }
          if ([int]$s.parity.false_reject_count -ne 0) { throw "WINDOWS_FALSE_REJECT_NONZERO" }
          if (-not [bool]$s.parity.fail_closed_parity) { throw "WINDOWS_FAIL_CLOSED_NOT_PASS" }
          if (-not [bool]$s.deterministic_repeat_pass) { throw "WINDOWS_DETERMINISM_NOT_PASS" }
          $public=[ordered]@{
            platform="windows_owner_offline"
            private_head=$env:PRIVATE_HEAD
            manifest_count=[int]$s.manifest_count
            manifest_sha256=$s.manifest_sha256
            current_ledger_sha256=$s.current_ledger_sha256
            cel_ledger_sha256=$s.cel_ledger_sha256
            decision_parity_percent=$s.parity.decision_parity_percent
            unsafe_selection_count=$s.parity.unsafe_selection_count
            false_reject_count=$s.parity.false_reject_count
            fail_closed_parity=$s.parity.fail_closed_parity
            deterministic_repeat_pass=$s.deterministic_repeat_pass
            trace_comparators=$s.trace_comparators
            performance=$s.performance
          }
          $public | ConvertTo-Json -Depth 12 -Compress
          "manifest_sha256=$($s.manifest_sha256)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "manifest_count=$($s.manifest_count)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "current_sha256=$($s.current_ledger_sha256)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "cel_sha256=$($s.cel_ledger_sha256)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "parity_percent=$($s.parity.decision_parity_percent)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "unsafe_count=$($s.parity.unsafe_selection_count)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "false_reject_count=$($s.parity.false_reject_count)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "fail_closed=$($s.parity.fail_closed_parity.ToString().ToLowerInvariant())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "deterministic=$($s.deterministic_repeat_pass.ToString().ToLowerInvariant())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Prove Owner offline no-bootstrap runtime
        working-directory: private-app
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $fresh=Join-Path $env:RUNNER_TEMP "app-cel-shadow-owner-fresh"
          $launcherText=Get-Content (Join-Path $fresh "START_STOUT_MACHINE_SELECTION.cmd") -Raw
          foreach ($forbidden in @("pip install","Invoke-WebRequest","curl ","winget ")) {
            if ($launcherText.IndexOf($forbidden,[System.StringComparison]::OrdinalIgnoreCase) -ge 0) { throw "RUNTIME_DOWNLOAD_TOKEN:$forbidden" }
          }
          $ownerText=Get-Content (Join-Path $fresh "release/issue_169/owner_start.py") -Raw
          if ($ownerText -notmatch '"--no-bootstrap"') { throw "NO_BOOTSTRAP_SEMANTICS_MISSING" }
          $env:PIP_NO_INDEX="1"
          $env:PIP_DISABLE_PIP_VERSION_CHECK="1"
          $env:PYTHONNOUSERSITE="1"
          $proc=Start-Process -FilePath "cmd.exe" -ArgumentList "/c","START_STOUT_MACHINE_SELECTION.cmd > owner-shadow.log 2>&1" -WorkingDirectory $fresh -PassThru -WindowStyle Hidden
          try {
            $ok=$false
            for ($i=0; $i -lt 180; $i++) {
              Start-Sleep -Seconds 1
              try {
                $h=Invoke-RestMethod -Uri "http://127.0.0.1:8765/health" -TimeoutSec 2
                if ($h) { $ok=$true; break }
              } catch {}
              if ($proc.HasExited) { break }
            }
            if (-not $ok) {
              Get-Content (Join-Path $fresh "owner-shadow.log") -ErrorAction SilentlyContinue
              throw "OWNER_OFFLINE_NO_BOOTSTRAP_HEALTH_FAILED"
            }
            Write-Host "WINDOWS_OWNER_OFFLINE_NO_BOOTSTRAP=PASS"
          } finally {
            cmd /c "taskkill /PID $($proc.Id) /T /F" | Out-Null
          }

  cross_platform:
    name: Windows Web exact corpus parity
    needs:
      - web_shadow
      - windows_shadow
    runs-on: ubuntu-latest
    steps:
      - name: Require identical committed corpus results
        shell: bash
        env:
          WEB_MANIFEST: ${{ needs.web_shadow.outputs.manifest_sha256 }}
          WIN_MANIFEST: ${{ needs.windows_shadow.outputs.manifest_sha256 }}
          WEB_COUNT: ${{ needs.web_shadow.outputs.manifest_count }}
          WIN_COUNT: ${{ needs.windows_shadow.outputs.manifest_count }}
          WEB_CURRENT: ${{ needs.web_shadow.outputs.current_sha256 }}
          WIN_CURRENT: ${{ needs.windows_shadow.outputs.current_sha256 }}
          WEB_CEL: ${{ needs.web_shadow.outputs.cel_sha256 }}
          WIN_CEL: ${{ needs.windows_shadow.outputs.cel_sha256 }}
          WEB_PARITY: ${{ needs.web_shadow.outputs.parity_percent }}
          WIN_PARITY: ${{ needs.windows_shadow.outputs.parity_percent }}
          WEB_UNSAFE: ${{ needs.web_shadow.outputs.unsafe_count }}
          WIN_UNSAFE: ${{ needs.windows_shadow.outputs.unsafe_count }}
          WEB_FALSE: ${{ needs.web_shadow.outputs.false_reject_count }}
          WIN_FALSE: ${{ needs.windows_shadow.outputs.false_reject_count }}
          WEB_FAIL: ${{ needs.web_shadow.outputs.fail_closed }}
          WIN_FAIL: ${{ needs.windows_shadow.outputs.fail_closed }}
          WEB_DET: ${{ needs.web_shadow.outputs.deterministic }}
          WIN_DET: ${{ needs.windows_shadow.outputs.deterministic }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          assert os.environ["WEB_MANIFEST"] == os.environ["WIN_MANIFEST"] and os.environ["WEB_MANIFEST"]
          assert os.environ["WEB_COUNT"] == os.environ["WIN_COUNT"] and int(os.environ["WEB_COUNT"]) > 0
          assert os.environ["WEB_CURRENT"] == os.environ["WIN_CURRENT"]
          assert os.environ["WEB_CEL"] == os.environ["WIN_CEL"]
          assert float(os.environ["WEB_PARITY"]) == float(os.environ["WIN_PARITY"]) == 100.0
          assert int(os.environ["WEB_UNSAFE"]) == int(os.environ["WIN_UNSAFE"]) == 0
          assert int(os.environ["WEB_FALSE"]) == int(os.environ["WIN_FALSE"]) == 0
          assert os.environ["WEB_FAIL"] == os.environ["WIN_FAIL"] == "true"
          assert os.environ["WEB_DET"] == os.environ["WIN_DET"] == "true"
          print(json.dumps({
              "result":"PASS",
              "private_head":os.environ["PRIVATE_HEAD"],
              "manifest_count":int(os.environ["WEB_COUNT"]),
              "manifest_sha256":os.environ["WEB_MANIFEST"],
              "current_ledger_sha256":os.environ["WEB_CURRENT"],
              "cel_ledger_sha256":os.environ["WEB_CEL"],
              "decision_parity_percent":100.0,
              "unsafe_selection_count":0,
              "false_reject_count":0,
              "fail_closed_parity":True,
              "deterministic_repeat_pass":True,
              "private_artifacts_published":False,
          },sort_keys=True))
          PY
