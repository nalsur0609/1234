name: APP-BUILD-6 Public Carrier Exact-Head Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".ci/triggers/app-build-6.txt"

permissions:
  contents: read

env:
  SOURCE_REPOSITORY: nalsur0609/PROGRAMMA_PODBORA_DEV2_SANDBOX
  SOURCE_HEAD: 70bf3eae906102dc003f7f06cd7a8bdd32515589
  SOURCE_BASE: 45533ff270b6244c44fb3cdb976e02f6231d9879

jobs:
  windows_owner_package:
    name: Windows Owner package live gate
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      binding_sha256: ${{ steps.owner_gate.outputs.binding_sha256 }}
      linked_set_sha256: ${{ steps.owner_gate.outputs.linked_set_sha256 }}
      selectable_set_sha256: ${{ steps.owner_gate.outputs.selectable_set_sha256 }}
      exact79_sha256: ${{ steps.owner_gate.outputs.exact79_sha256 }}
      linked_ready: ${{ steps.owner_gate.outputs.linked_ready }}
      selectable: ${{ steps.owner_gate.outputs.selectable }}
      blocked_ready: ${{ steps.owner_gate.outputs.blocked_ready }}
      package_filename: ${{ steps.owner_gate.outputs.package_filename }}
      package_bytes: ${{ steps.owner_gate.outputs.package_bytes }}
      package_sha256: ${{ steps.owner_gate.outputs.package_sha256 }}
    steps:
      - name: Public carrier provenance
        shell: pwsh
        run: |
          Write-Host "PUBLIC_CI_CARRIER=nalsur0609/1234"
          Write-Host "PRIVATE_SSOT=$env:SOURCE_REPOSITORY"
          Write-Host "SOURCE_HEAD=$env:SOURCE_HEAD"
          Write-Host "SOURCE_BASE=$env:SOURCE_BASE"
          Write-Host "ARTIFACT_RETENTION=NONE"

      - uses: actions/checkout@v4
        with:
          repository: nalsur0609/PROGRAMMA_PODBORA_DEV2_SANDBOX
          ref: ${{ env.SOURCE_HEAD }}
          token: ${{ secrets.DEV2_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preserve exact Git authority bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git clean -fdx

      - name: Verify exact-head and merge-base
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $actual = (git rev-parse HEAD).Trim()
          $expected = "${{ env.SOURCE_HEAD }}"
          if ($actual -ne $expected) { throw ("EXACT_HEAD_MISMATCH:" + $actual + ":" + $expected) }
          $base = "45533ff270b6244c44fb3cdb976e02f6231d9879"
          $mergeBase = (git merge-base $base HEAD).Trim()
          if ($mergeBase -ne $base) { throw ("MERGE_BASE_MISMATCH:" + $mergeBase + ":" + $base) }
          $behind = [int](git rev-list --count "HEAD..$base")
          if ($behind -ne 0) { throw ("BRANCH_BEHIND_ACCEPTED_BASE:" + $behind) }
          Write-Host "EXACT_HEAD=$actual"
          Write-Host "MERGE_BASE=$mergeBase"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Source regressions for accepted shared authority
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m compileall -q APP_CORE_R3_PILOT release/issue_169 release/issue_193 release/issue_197 release/issue_199 tools/app_build_6_stout_1031_gate.py
          python APP_CORE_R3_PILOT/tests/test_stout_ready_1543_shared_core_r1.py
          python APP_CORE_R3_PILOT/tests/test_stout_ball_valve_114_adapter_r1.py
          python APP_CORE_R3_PILOT/tests/test_stout_ready_1464_shared_core_r1.py
          python APP_CORE_R3_PILOT/tests/test_owner_package_r1.py
          python APP_CORE_R3_PILOT/tests/test_machine_selection_r1.py
          python APP_CORE_R3_PILOT/tests/test_machine_selection_profile_conflict_r1.py

      - name: Materialize pinned Windows package runtime at build time
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rt = Join-Path $PWD "runtime_input"
          New-Item -ItemType Directory -Force "$rt/python","$rt/node","$rt/meilisearch" | Out-Null

          $pyUrl = "https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip"
          $pyZip = Join-Path $env:RUNNER_TEMP "python-3.12.10-embed-amd64.zip"
          Invoke-WebRequest -Uri $pyUrl -OutFile $pyZip
          $pySha = (Get-FileHash $pyZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($pySha -ne "4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3") { throw ("PYTHON_SHA256_MISMATCH:" + $pySha) }
          Expand-Archive $pyZip "$rt/python" -Force
          $pth = Get-ChildItem "$rt/python" -Filter "python*._pth" | Select-Object -First 1
          if (-not $pth) { throw "PYTHON_EMBED_PTH_MISSING" }
          (Get-Content $pth.FullName) -replace '^#import site$','import site' | Set-Content $pth.FullName -Encoding ascii

          $getPip = Join-Path $env:RUNNER_TEMP "get-pip.py"
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile $getPip
          $getPipSha = (Get-FileHash $getPip -Algorithm SHA256).Hash.ToLowerInvariant()
          & "$rt/python/python.exe" $getPip "--disable-pip-version-check"
          if ($LASTEXITCODE -ne 0) { throw ("PACKAGE_LOCAL_GET_PIP_FAILED:" + $LASTEXITCODE) }
          & "$rt/python/python.exe" -m pip --version
          if ($LASTEXITCODE -ne 0) { throw "PACKAGE_LOCAL_PIP_NOT_PROVISIONED" }

          $nodeVersion = "22.23.3"
          $nodeName = "node-v$nodeVersion-win-x64.zip"
          $nodeBase = "https://nodejs.org/download/release/v$nodeVersion"
          $nodeZip = Join-Path $env:RUNNER_TEMP $nodeName
          $sums = Join-Path $env:RUNNER_TEMP "node-SHASUMS256.txt"
          Invoke-WebRequest -Uri "$nodeBase/$nodeName" -OutFile $nodeZip
          Invoke-WebRequest -Uri "$nodeBase/SHASUMS256.txt" -OutFile $sums
          $expectedLine = Get-Content $sums | Where-Object { $_ -match [regex]::Escape($nodeName) } | Select-Object -First 1
          if (-not $expectedLine) { throw "NODE_OFFICIAL_SHA_NOT_FOUND" }
          $nodeExpected = ($expectedLine -split '\s+')[0].ToLowerInvariant()
          $nodeSha = (Get-FileHash $nodeZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($nodeSha -ne $nodeExpected) { throw ("NODE_SHA256_MISMATCH:" + $nodeSha + ":" + $nodeExpected) }
          $nodeTmp = Join-Path $env:RUNNER_TEMP "node-unpack"
          Expand-Archive $nodeZip $nodeTmp -Force
          $nodeExe = Get-ChildItem $nodeTmp -Recurse -Filter node.exe | Select-Object -First 1
          if (-not $nodeExe) { throw "NODE_EXE_MISSING" }
          Copy-Item $nodeExe.FullName "$rt/node/node.exe"

          $meiliUrl = "https://github.com/meilisearch/meilisearch/releases/download/v1.54.0/meilisearch-windows-amd64.exe"
          $meili = "$rt/meilisearch/meilisearch-windows-amd64.exe"
          Invoke-WebRequest -Uri $meiliUrl -OutFile $meili
          $meiliSha = (Get-FileHash $meili -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($meiliSha -ne "1a3a3f2fa249b2a471eca479d37b1d3bbb9bda1aacae3eaf7839218105810125") { throw ("MEILI_SHA256_MISMATCH:" + $meiliSha) }

          [ordered]@{
            python=[ordered]@{version="3.12.10";sha256=$pySha;bytes=(Get-Item $pyZip).Length}
            pip_bootstrap=[ordered]@{build_time_only=$true;sha256=$getPipSha}
            node=[ordered]@{version=$nodeVersion;sha256=$nodeSha;official_shasums_verified=$true;bytes=(Get-Item $nodeZip).Length}
            meilisearch=[ordered]@{version="1.54.0";sha256=$meiliSha;bytes=(Get-Item $meili).Length}
          } | ConvertTo-Json -Depth 6 | Set-Content "RUNTIME_INPUT_EVIDENCE.json" -Encoding utf8

      - name: Build STOUT-1031 Owner ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $head = (git rev-parse HEAD).Trim()
          & "runtime_input/python/python.exe" "release/issue_199/build_owner_package_stout_1031_r1.py" --repo-root "$PWD" --offline-runtime-root "$PWD/runtime_input" --output "$PWD/APP_BUILD_6_STOUT_1031_OWNER_PACKAGE_R1" --build-head $head --zip
          if ($LASTEXITCODE -ne 0) { throw ("OWNER_PACKAGE_BUILD_FAILED:" + $LASTEXITCODE) }

      - name: Fresh extraction offline launcher UI API and eligibility gate
        id: owner_gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $fresh = Join-Path $env:RUNNER_TEMP "app-build-6-stout-1031-fresh"
          if (Test-Path $fresh) { Remove-Item $fresh -Recurse -Force }
          Expand-Archive "APP_BUILD_6_STOUT_1031_OWNER_PACKAGE_R1.zip" $fresh

          $py = Join-Path $fresh "runtime/python/python.exe"
          & $py -c "import sys,jsonschema,pint,platformdirs,pdfplumber,fitz; print(sys.executable); print(pint.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "FRESH_PACKAGE_LOCAL_RUNTIME_IMPORT_FAILED" }

          $build = Get-Content (Join-Path $fresh "BUILD_IDENTITY.json") -Raw | ConvertFrom-Json
          if ([int]$build.linked_universe_count -ne 1543) { throw "LINKED_READY_NOT_1543" }
          if ([int]$build.auto_selection_ready_count -ne 1031) { throw "SELECTABLE_NOT_1031" }
          if ([int]$build.blocked_ready_count -ne 512) { throw "BLOCKED_READY_NOT_512" }
          if (([int]$build.auto_selection_ready_count + [int]$build.remaining_bounded_adapter_count + [int]$build.engineering_solver_required_count) -ne 1543) { throw "ACCOUNTING_RELATION_FAILED" }
          if ($build.schema -ne "APP_BUILD_6_STOUT_1031_OWNER_PACKAGE_R1_BUILD_IDENTITY") { throw "BUILD_IDENTITY_SCHEMA_NOT_APP_BUILD_6" }
          if ([int]$build.owner_package_issue -ne 199) { throw "BUILD_IDENTITY_ISSUE_NOT_199" }
          if ([int]$build.predecessor_issue -ne 197) { throw "BUILD_IDENTITY_PREDECESSOR_NOT_197" }
          if ($build.predecessor_accepted_head -ne "45533ff270b6244c44fb3cdb976e02f6231d9879") { throw "BUILD_IDENTITY_PREDECESSOR_HEAD_MISMATCH" }
          if ([int]$build.predecessor_selectable_preserved_count -ne 952) { throw "BUILD_IDENTITY_PREDECESSOR_NOT_952" }
          if ([int]$build.legacy_exact58_preserved_count -ne 58) { throw "BUILD_IDENTITY_EXACT58_NOT_58" }
          if ([int]$build.exact114_preserved_count -ne 114) { throw "BUILD_IDENTITY_EXACT114_NOT_114" }
          if ([int]$build.exact79_preserved_count -ne 79) { throw "BUILD_IDENTITY_EXACT79_NOT_79" }
          if ($build.exact79_sha256 -ne "1b9234caf7189475b224774c9ad0c2cc32acedd1ff298d549e470f442fa0a674") { throw "BUILD_IDENTITY_EXACT79_HASH_MISMATCH" }
          if ($build.accepted_shared_binding_sha256 -ne "3546d7192b0f201ac25cc3717aa1af07c6607ee02fb7854ecbeb1d99a57a085d") { throw "BUILD_IDENTITY_BINDING_HASH_MISMATCH" }
          if ($build.accepted_linked_exact_set_sha256 -ne "0a4a390d6d4e13b5cc073fc7f9fe5f431312e9002c4a0a5e5f75fcdaba6bbdac") { throw "BUILD_IDENTITY_LINKED_HASH_MISMATCH" }
          if ($build.accepted_selectable_exact_set_sha256 -ne "993b5b3473f48bcb2d1e907927e620bd78ce6845cd8ede92e98dc15d18bc4c2c") { throw "BUILD_IDENTITY_SELECTABLE_HASH_MISMATCH" }

          $launcher = Join-Path $fresh "START_STOUT_MACHINE_SELECTION.cmd"
          $launcherText = Get-Content $launcher -Raw
          if ($launcherText -notmatch 'runtime\\python\\python.exe') { throw "PACKAGE_LOCAL_PYTHON_LAUNCHER_MISSING" }
          foreach ($forbidden in @("pip install","curl ","Invoke-WebRequest","bitsadmin","winget ")) {
            if ($launcherText.IndexOf($forbidden,[System.StringComparison]::OrdinalIgnoreCase) -ge 0) { throw ("RUNTIME_DOWNLOAD_TOKEN_IN_LAUNCHER:" + $forbidden) }
          }
          $ownerText = Get-Content (Join-Path $fresh "release/issue_169/owner_start.py") -Raw
          if ($ownerText -notmatch '"--no-bootstrap"') { throw "NO_BOOTSTRAP_LAUNCH_SEMANTICS_MISSING" }
          foreach ($forbidden in @("Invoke-WebRequest","urllib.request.urlretrieve","requests.get(","pip.main(")) {
            if ($ownerText.IndexOf($forbidden,[System.StringComparison]::OrdinalIgnoreCase) -ge 0) { throw ("RUNTIME_DOWNLOAD_TOKEN_IN_OWNER_START:" + $forbidden) }
          }

          $env:PIP_NO_INDEX = "1"
          $env:PIP_DISABLE_PIP_VERSION_CHECK = "1"
          $env:PYTHONNOUSERSITE = "1"

          function Stop-OwnedProcessTree([int]$ProcessId) {
            $children = @(Get-CimInstance Win32_Process -Filter "ParentProcessId=$ProcessId" -ErrorAction SilentlyContinue)
            foreach ($child in $children) { Stop-OwnedProcessTree -ProcessId ([int]$child.ProcessId) }
            Stop-Process -Id $ProcessId -Force -ErrorAction SilentlyContinue
          }

          $foreignOut = Join-Path $fresh "FOREIGN_PORT_PROBE.out.log"
          $foreignErr = Join-Path $fresh "FOREIGN_PORT_PROBE.err.log"
          $foreign = Start-Process -FilePath $py -ArgumentList "-m","http.server","8765","--bind","127.0.0.1" -WorkingDirectory $fresh -RedirectStandardOutput $foreignOut -RedirectStandardError $foreignErr -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          if ($foreign.HasExited) { throw "FOREIGN_PORT_PROBE_FAILED_TO_START" }
          $conflict = Start-Process -FilePath "cmd.exe" -ArgumentList "/c","START_STOUT_MACHINE_SELECTION.cmd > OWNER_CONFLICT.log 2>&1" -WorkingDirectory $fresh -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 5
          if ($foreign.HasExited) { throw "LAUNCHER_KILLED_UNRELATED_PORT_OWNER" }
          if (-not $conflict.HasExited) { Stop-OwnedProcessTree -ProcessId $conflict.Id }
          Stop-Process -Id $foreign.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 1

          $launchLog = Join-Path $fresh "OWNER_LAUNCH.log"
          $proc = Start-Process -FilePath "cmd.exe" -ArgumentList "/c","START_STOUT_MACHINE_SELECTION.cmd > OWNER_LAUNCH.log 2>&1" -WorkingDirectory $fresh -PassThru -WindowStyle Hidden
          $ok = $false
          for ($i=0; $i -lt 120; $i++) {
            Start-Sleep -Seconds 1
            try {
              $h = Invoke-RestMethod -Uri "http://127.0.0.1:8765/health" -TimeoutSec 2
              if ($h) { $ok = $true; break }
            } catch {}
            if ($proc.HasExited) { break }
          }
          if (-not $ok) {
            if (Test-Path $launchLog) { Get-Content $launchLog }
            throw "OWNER_DOUBLE_CLICK_UI_HEALTH_FAILED"
          }

          $state = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/state" -TimeoutSec 10
          if ([int]$state.machine_selection.linked_universe_count -ne 1543) { throw "API_LINKED_READY_NOT_1543" }
          if ([int]$state.machine_selection.auto_selection_ready_count -ne 1031) { throw "API_SELECTABLE_NOT_1031" }

          & $py "$PWD/tools/app_build_6_stout_1031_gate.py" --package-root "$fresh" --api-url "http://127.0.0.1:8765" --out "$PWD/WINDOWS_STOUT_1031_GATE.json"
          if ($LASTEXITCODE -ne 0) { throw ("WINDOWS_STOUT_1031_GATE_FAILED:" + $LASTEXITCODE) }

          if (-not $proc.HasExited) { Stop-OwnedProcessTree -ProcessId $proc.Id }
          Start-Sleep -Seconds 2
          Copy-Item $launchLog "$PWD/OWNER_LAUNCH.log" -Force

          $gate = Get-Content "WINDOWS_STOUT_1031_GATE.json" -Raw | ConvertFrom-Json
          $zip = Get-Item "APP_BUILD_6_STOUT_1031_OWNER_PACKAGE_R1.zip"
          $zipSha = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{
            schema="APP_BUILD_6_STOUT_1031_OWNER_PACKAGE_R1_WINDOWS_EVIDENCE"
            exact_head=(git rev-parse HEAD).Trim()
            windows_runner=$env:RUNNER_NAME
            final_zip=[ordered]@{filename=$zip.Name;bytes=$zip.Length;sha256=$zipSha}
            fresh_extract="PASS"
            shipped_launcher="START_STOUT_MACHINE_SELECTION.cmd"
            double_click_launcher="PASS"
            package_local_python="PASS"
            offline_no_bootstrap="PASS"
            runtime_dependency_download="FORBIDDEN_AND_NOT_USED_BY_OWNER_LAUNCH_PATH"
            ui_127_0_0_1_8765="PASS"
            api_state="PASS"
            search_index="PASS"
            linked_ready=[int]$gate.linked_ready
            selectable=[int]$gate.selectable
            blocked_ready=[int]$gate.blocked_ready
            remaining_bounded=171
            engineering_solver=341
            predecessor_952_preserved="PASS"
            exact58_regression="PASS"
            exact114_regression="PASS"
            exact79_regression="PASS"
            exact79_sha256=$gate.exact79_sha256
            linked_exact_set_sha256=$gate.linked_exact_set_sha256
            selectable_exact_set_sha256=$gate.selectable_exact_set_sha256
            unrelated_port_owner_survived="PASS"
            owned_process_cleanup="PASS"
            binding_sha256=$gate.binding_sha256
            selection_gate="PASS"
          } | ConvertTo-Json -Depth 8 | Set-Content "OWNER_WINDOWS_GATE_EVIDENCE.json" -Encoding utf8

          "binding_sha256=$($gate.binding_sha256)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "linked_set_sha256=$($gate.linked_exact_set_sha256)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "selectable_set_sha256=$($gate.selectable_exact_set_sha256)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "exact79_sha256=$($gate.exact79_sha256)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "linked_ready=$([int]$gate.linked_ready)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "selectable=$([int]$gate.selectable)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "blocked_ready=$([int]$gate.blocked_ready)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "package_filename=$($zip.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "package_bytes=$($zip.Length)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "package_sha256=$zipSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Get-Content "OWNER_WINDOWS_GATE_EVIDENCE.json"


  web_shared_authority:
    name: Web shared authority live gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      binding_sha256: ${{ steps.web_gate.outputs.binding_sha256 }}
      linked_set_sha256: ${{ steps.web_gate.outputs.linked_set_sha256 }}
      selectable_set_sha256: ${{ steps.web_gate.outputs.selectable_set_sha256 }}
      exact79_sha256: ${{ steps.web_gate.outputs.exact79_sha256 }}
      linked_ready: ${{ steps.web_gate.outputs.linked_ready }}
      selectable: ${{ steps.web_gate.outputs.selectable }}
      blocked_ready: ${{ steps.web_gate.outputs.blocked_ready }}
    services:
      meilisearch:
        image: getmeili/meilisearch:v1.54.0
        env:
          MEILI_MASTER_KEY: app-build-6-stout-1031-ci-key
          MEILI_NO_ANALYTICS: "true"
        ports:
          - 7700:7700
    env:
      APP_CORE_MEILI_URL: http://127.0.0.1:7700
      APP_CORE_MEILI_MASTER_KEY: app-build-6-stout-1031-ci-key
      APP_WEB_HOST: 127.0.0.1
      APP_WEB_PORT: "8765"

    steps:
      - name: Public carrier provenance
        shell: bash
        run: |
          set -euo pipefail
          echo "PUBLIC_CI_CARRIER=nalsur0609/1234"
          echo "PRIVATE_SSOT=$SOURCE_REPOSITORY"
          echo "SOURCE_HEAD=$SOURCE_HEAD"
          echo "SOURCE_BASE=$SOURCE_BASE"
          echo "ARTIFACT_RETENTION=NONE"

      - uses: actions/checkout@v4
        with:
          repository: nalsur0609/PROGRAMMA_PODBORA_DEV2_SANDBOX
          ref: ${{ env.SOURCE_HEAD }}
          token: ${{ secrets.DEV2_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify web exact-head and merge-base
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${{ env.SOURCE_HEAD }}"
          base="45533ff270b6244c44fb3cdb976e02f6231d9879"
          test "$(git merge-base "$base" HEAD)" = "$base"
          test "$(git rev-list --count "HEAD..$base")" = "0"
          echo "EXACT_HEAD=$actual"
          echo "MERGE_BASE=$base"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"

      - name: Install exact accepted dependencies
        run: |
          python -m pip install --disable-pip-version-check "jsonschema==4.25.1"
          python -m pip install --disable-pip-version-check --require-hashes -r PILOT_READY/units_engine/requirements-r1.lock
          python -m pip install --disable-pip-version-check -r tools/pdf_factory_r1/requirements-r1.txt

      - name: Web source regressions
        run: |
          python APP_CORE_R3_PILOT/tests/test_stout_ready_1543_shared_core_r1.py
          python APP_CORE_R3_PILOT/tests/test_stout_ball_valve_114_adapter_r1.py
          python APP_CORE_R3_PILOT/tests/test_stout_ready_1464_shared_core_r1.py
          python APP_CORE_R3_PILOT/tests/test_web_foundation_r1.py

      - name: Start accepted Web shared core
        shell: bash
        run: |
          set -euo pipefail
          export APP_CORE_NODE_BINARY="$(command -v node)"
          export APP_CORE_BUILD_HEAD="$(git rev-parse HEAD)"
          python APP_CORE_R3_PILOT/web_runtime.py > WEB_APP_BUILD_6.log 2>&1 &
          echo $! > WEB_APP_BUILD_6.pid
          ok=0
          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8765/ready > WEB_APP_BUILD_6_READY.json 2>/dev/null; then
              ok=1
              break
            fi
            if ! kill -0 "$(cat WEB_APP_BUILD_6.pid)" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            cat WEB_APP_BUILD_6.log || true
            exit 1
          fi

      - name: Web STOUT-1031 authority and eligibility gate
        id: web_gate
        shell: bash
        run: |
          set -euo pipefail
          binding="$PWD/APP_CORE_R3_PILOT/runtime/web_r1/authority/STOUT_READY_1543_SHARED_BINDING_R1.json"
          python tools/app_build_6_stout_1031_gate.py --package-root "$PWD" --binding-path "$binding" --api-url "http://127.0.0.1:8765" --out WEB_STOUT_1031_GATE.json

          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          gate=json.loads(Path("WEB_STOUT_1031_GATE.json").read_text(encoding="utf-8"))
          evidence={
              "schema":"APP_BUILD_6_STOUT_1031_OWNER_PACKAGE_R1_WEB_EVIDENCE",
              "exact_head":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
              "web_runtime":"PASS",
              "ui_api":"PASS",
              "search_index":"PASS",
              "linked_ready":gate["linked_ready"],
              "selectable":gate["selectable"],
              "blocked_ready":gate["blocked_ready"],
              "remaining_bounded":171,
              "engineering_solver":341,
              "predecessor_952_preserved":"PASS",
              "exact58_regression":"PASS",
              "exact114_regression":"PASS",
              "exact79_regression":"PASS",
              "exact79_sha256":gate["exact79_sha256"],
