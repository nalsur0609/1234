name: APP-CEL-1 Public Carrier Exact-Head Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REPOSITORY: nalsur0609/PROGRAMMA_PODBORA_DEV2_SANDBOX
  SOURCE_HEAD: d86ccf162680ad59317153956b8eb39f95e9b00d
  TASK_BASE: 70bf3eae906102dc003f7f06cd7a8bdd32515589

jobs:
  web_shadow:
    name: Web CEL shadow parity
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      manifest_sha256: ${{ steps.shadow.outputs.manifest_sha256 }}
      manifest_count: ${{ steps.shadow.outputs.manifest_count }}
      current_sha256: ${{ steps.shadow.outputs.current_sha256 }}
      cel_sha256: ${{ steps.shadow.outputs.cel_sha256 }}
      parity_percent: ${{ steps.shadow.outputs.parity_percent }}
      unsafe_count: ${{ steps.shadow.outputs.unsafe_count }}
      false_reject_count: ${{ steps.shadow.outputs.false_reject_count }}
      fail_closed: ${{ steps.shadow.outputs.fail_closed }}
      deterministic: ${{ steps.shadow.outputs.deterministic }}
    services:
      meilisearch:
        image: getmeili/meilisearch:v1.54.0
        env:
          MEILI_MASTER_KEY: app-cel-shadow-r1-key
          MEILI_NO_ANALYTICS: "true"
        ports:
          - 7700:7700
    env:
      APP_CORE_MEILI_URL: http://127.0.0.1:7700
      APP_CORE_MEILI_MASTER_KEY: app-cel-shadow-r1-key
      APP_WEB_HOST: 127.0.0.1
      APP_WEB_PORT: "8765"

    steps:
      - name: Public carrier provenance
        shell: bash
        run: |
          echo "PUBLIC_CI_CARRIER=nalsur0609/1234"
          echo "PRIVATE_SSOT=$SOURCE_REPOSITORY"
          echo "SOURCE_HEAD=$SOURCE_HEAD"
          echo "TASK_BASE=$TASK_BASE"
          echo "ARTIFACT_RETENTION=NONE"
      - name: Checkout pinned private SSOT
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_HEAD }}
          token: ${{ secrets.DEV2_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact task ancestry
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${{ env.SOURCE_HEAD }}"
          test "$(git merge-base "$TASK_BASE" HEAD)" = "$TASK_BASE"
          test "$(git rev-list --count "HEAD..$TASK_BASE")" = "0"
          echo "EXACT_HEAD=$actual"
          echo "TASK_BASE=$TASK_BASE"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          cache-dependency-path: APP_CORE_R3_PILOT/cel_shadow_r1/go.sum

      - name: Build accepted CEL-go shadow binary
        working-directory: APP_CORE_R3_PILOT/cel_shadow_r1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin
          CGO_ENABLED=0 go build -trimpath -o bin/app-cel-shadow-r1 .
          ./bin/app-cel-shadow-r1 </dev/null | head -n 1

      - name: Install accepted Web dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "jsonschema==4.25.1"
          python -m pip install --disable-pip-version-check --require-hashes -r PILOT_READY/units_engine/requirements-r1.lock
          python -m pip install --disable-pip-version-check -r tools/pdf_factory_r1/requirements-r1.txt

      - name: Current matcher and shadow regressions
        shell: bash
        run: |
          set -euo pipefail
          python APP_CORE_R3_PILOT/tests/test_machine_selection_r1.py
          python APP_CORE_R3_PILOT/tests/test_machine_selection_profile_conflict_r1.py
          python APP_CORE_R3_PILOT/tests/test_stout_ball_valve_114_adapter_r1.py
          python APP_CORE_R3_PILOT/tests/test_stout_ready_1543_shared_core_r1.py
          python APP_CORE_R3_PILOT/tests/test_cel_shadow_pilot_r1.py

      - name: Start accepted Web shared runtime
        shell: bash
        run: |
          set -euo pipefail
          export APP_CORE_NODE_BINARY="$(command -v node)"
          export APP_CORE_BUILD_HEAD="$(git rev-parse HEAD)"
          python APP_CORE_R3_PILOT/web_runtime.py > WEB_APP_CEL_SHADOW.log 2>&1 &
          echo $! > WEB_APP_CEL_SHADOW.pid
          ok=0
          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8765/ready > WEB_APP_CEL_READY.json 2>/dev/null; then
              ok=1
              break
            fi
            if ! kill -0 "$(cat WEB_APP_CEL_SHADOW.pid)" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            cat WEB_APP_CEL_SHADOW.log || true
            exit 1
          fi
          cat WEB_APP_CEL_READY.json

      - name: Run Web shadow corpus
        id: shadow
        shell: bash
        run: |
          set -euo pipefail
          python APP_CORE_R3_PILOT/cel_shadow_r1/shadow.py             --binary APP_CORE_R3_PILOT/cel_shadow_r1/bin/app-cel-shadow-r1             --evidence-dir release/issue_201/evidence             --summary-out WEB_CEL_SHADOW_SUMMARY.json
          second="$RUNNER_TEMP/app-cel-shadow-web-evidence-generation-2"
          python APP_CORE_R3_PILOT/cel_shadow_r1/shadow.py             --binary APP_CORE_R3_PILOT/cel_shadow_r1/bin/app-cel-shadow-r1             --evidence-dir "$second"             --summary-out "$RUNNER_TEMP/WEB_CEL_SHADOW_SUMMARY_GENERATION_2.json"
          for name in REQUEST_CASE_MANIFEST.json CURRENT_MATCHER_RESULT_LEDGER.json CEL_RESULT_LEDGER.json; do
            cmp "release/issue_201/evidence/$name" "$second/$name"
          done
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path("release/issue_201/evidence")
          first=json.loads(Path("WEB_CEL_SHADOW_SUMMARY.json").read_text(encoding="utf-8"))
          second=json.loads(Path(os.environ["RUNNER_TEMP"]).joinpath("WEB_CEL_SHADOW_SUMMARY_GENERATION_2.json").read_text(encoding="utf-8"))
          keys=("manifest_sha256","current_ledger_sha256","cel_ledger_sha256")
          assert all(first[k] == second[k] for k in keys)
          d=json.loads(root.joinpath("DETERMINISTIC_VALIDATION.json").read_text(encoding="utf-8"))
          d["full_payload_generation_count"]=2
          d["full_payload_byte_identity"]={
              "REQUEST_CASE_MANIFEST.json": True,
              "CURRENT_MATCHER_RESULT_LEDGER.json": True,
              "CEL_RESULT_LEDGER.json": True,
          }
          d["independent_generation_sha256"]={
              "generation_1": {k:first[k] for k in keys},
              "generation_2": {k:second[k] for k in keys},
          }
          d["retention_repair"]="FULL_MANIFEST_AND_RESULT_LEDGER_PRIVATE_SSOT_R1"
          root.joinpath("DETERMINISTIC_VALIDATION.json").write_text(
              json.dumps(d,ensure_ascii=False,sort_keys=True,separators=(",",":"))+"\n",
              encoding="utf-8",newline="\n"
          )
          print("FULL_PAYLOAD_X2_BYTE_IDENTITY=PASS")
          PY
          python - <<'PY'
          import json, os
          from pathlib import Path
          s=json.loads(Path("WEB_CEL_SHADOW_SUMMARY.json").read_text(encoding="utf-8"))
          p=s["parity"]
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write(f"manifest_sha256={s['manifest_sha256']}\n")
              f.write(f"manifest_count={s['manifest_count']}\n")
              f.write(f"current_sha256={s['current_ledger_sha256']}\n")
              f.write(f"cel_sha256={s['cel_ledger_sha256']}\n")
              f.write(f"parity_percent={p['decision_parity_percent']}\n")
              f.write(f"unsafe_count={p['unsafe_selection_count']}\n")
              f.write(f"false_reject_count={p['false_reject_count']}\n")
              f.write(f"fail_closed={str(p['fail_closed_parity']).lower()}\n")
              f.write(f"deterministic={str(s['deterministic_repeat_pass']).lower()}\n")
          PY


      - name: Record Web execution evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          s=json.loads(Path("WEB_CEL_SHADOW_SUMMARY.json").read_text(encoding="utf-8"))
          health=json.loads(Path("WEB_APP_CEL_READY.json").read_text(encoding="utf-8"))
          value={
              "schema":"APP_CEL_SHADOW_PILOT_R1_WEB_EVIDENCE",
              "executed_head":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
              "web_runtime":"PASS",
              "shared_core_ready":bool(health.get("ready")),
              "current_matcher_authoritative":True,
              "cel_shadow":"PASS",
              "manifest_count":s["manifest_count"],
              "manifest_sha256":s["manifest_sha256"],
              "current_ledger_sha256":s["current_ledger_sha256"],
              "cel_ledger_sha256":s["cel_ledger_sha256"],
              "decision_parity_percent":s["parity"]["decision_parity_percent"],
              "unsafe_selection_count":s["parity"]["unsafe_selection_count"],
              "false_reject_count":s["parity"]["false_reject_count"],
              "fail_closed_parity":s["parity"]["fail_closed_parity"],
              "deterministic_repeat_pass":s["deterministic_repeat_pass"],
              "performance":s["performance"],
          }
          Path("WEB_CEL_SHADOW_EVIDENCE.json").write_text(json.dumps(value,ensure_ascii=False,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps(value,ensure_ascii=False,indent=2,sort_keys=True))
          PY
          kill "$(cat WEB_APP_CEL_SHADOW.pid)" || true
          wait "$(cat WEB_APP_CEL_SHADOW.pid)" 2>/dev/null || true

      - name: Encrypt retained corpus for one-time handoff
        shell: bash
        env:
          TRANSPORT_CERT_B64: 
        run: |
          set -euo pipefail
          echo "$TRANSPORT_CERT_B64" | base64 -d > "$RUNNER_TEMP/app-cel-retention-cert.pem"
          tar -czf "$RUNNER_TEMP/app-cel-retention.tar.gz" -C release/issue_201/evidence \
            REQUEST_CASE_MANIFEST.json \
            REQUEST_CASE_MANIFEST.sha256 \
            CURRENT_MATCHER_RESULT_LEDGER.json \
            CEL_RESULT_LEDGER.json \
            PARITY_LEDGER.json \
            DETERMINISTIC_VALIDATION.json \
            DECISION_TRACE_EVIDENCE.json \
            CURRENT_MATCHER_SEMANTIC_INVENTORY.json \
            MISMATCH_BLOCKER_TAXONOMY.json
          openssl smime -encrypt -aes-256-cbc -binary -in "$RUNNER_TEMP/app-cel-retention.tar.gz" \
            -outform DER -out "$RUNNER_TEMP/app-cel-retention.enc" "$RUNNER_TEMP/app-cel-retention-cert.pem"
          rm -f "$RUNNER_TEMP/app-cel-retention.tar.gz" "$RUNNER_TEMP/app-cel-retention-cert.pem"

      - name: One-time encrypted retention transport
        uses: actions/upload-artifact@v4
        with:
          name: app-cel-retention-encrypted
          path: ${{ runner.temp }}/app-cel-retention.enc
          if-no-files-found: error
          retention-days: 1


  windows_owner_shadow:
    name: Windows Owner offline CEL shadow
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      manifest_sha256: ${{ steps.winshadow.outputs.manifest_sha256 }}
      manifest_count: ${{ steps.winshadow.outputs.manifest_count }}
      current_sha256: ${{ steps.winshadow.outputs.current_sha256 }}
      cel_sha256: ${{ steps.winshadow.outputs.cel_sha256 }}
      parity_percent: ${{ steps.winshadow.outputs.parity_percent }}
      unsafe_count: ${{ steps.winshadow.outputs.unsafe_count }}
      false_reject_count: ${{ steps.winshadow.outputs.false_reject_count }}
      fail_closed: ${{ steps.winshadow.outputs.fail_closed }}
      deterministic: ${{ steps.winshadow.outputs.deterministic }}

    steps:
      - name: Checkout pinned private SSOT
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_HEAD }}
          token: ${{ secrets.DEV2_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preserve exact Git bytes and verify ancestry
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git clean -fdx
          $actual=(git rev-parse HEAD).Trim()
          if ($actual -ne "${{ env.SOURCE_HEAD }}") { throw "EXACT_HEAD_MISMATCH" }
          $mergeBase=(git merge-base $env:TASK_BASE HEAD).Trim()
          if ($mergeBase -ne $env:TASK_BASE) { throw "TASK_BASE_MERGE_BASE_MISMATCH:$mergeBase" }
          Write-Host "EXACT_HEAD=$actual"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          cache-dependency-path: APP_CORE_R3_PILOT/cel_shadow_r1/go.sum

      - name: Build Windows CEL-go shadow binary
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          Push-Location APP_CORE_R3_PILOT/cel_shadow_r1
          New-Item -ItemType Directory -Force bin | Out-Null
          $env:CGO_ENABLED="0"
          go build -trimpath -o bin/app-cel-shadow-r1.exe .
          if ($LASTEXITCODE -ne 0) { throw "CEL_GO_BUILD_FAILED" }
          Pop-Location

      - name: Source regressions
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          python APP_CORE_R3_PILOT/tests/test_machine_selection_r1.py
          python APP_CORE_R3_PILOT/tests/test_machine_selection_profile_conflict_r1.py
          python APP_CORE_R3_PILOT/tests/test_stout_ball_valve_114_adapter_r1.py
          python APP_CORE_R3_PILOT/tests/test_stout_ready_1543_shared_core_r1.py
          python APP_CORE_R3_PILOT/tests/test_cel_shadow_pilot_r1.py

      - name: Materialize pinned Owner runtime at build time
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $rt=Join-Path $PWD "runtime_input"
          New-Item -ItemType Directory -Force "$rt/python","$rt/node","$rt/meilisearch" | Out-Null
          $pyUrl="https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip"
          $pyZip=Join-Path $env:RUNNER_TEMP "python-3.12.10-embed-amd64.zip"
          Invoke-WebRequest -Uri $pyUrl -OutFile $pyZip
          $pySha=(Get-FileHash $pyZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($pySha -ne "4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3") { throw "PYTHON_SHA256_MISMATCH" }
          Expand-Archive $pyZip "$rt/python" -Force
          $pth=Get-ChildItem "$rt/python" -Filter "python*._pth" | Select-Object -First 1
          (Get-Content $pth.FullName) -replace '^#import site$','import site' | Set-Content $pth.FullName -Encoding ascii
          $getPip=Join-Path $env:RUNNER_TEMP "get-pip.py"
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile $getPip
          & "$rt/python/python.exe" $getPip --disable-pip-version-check
          if ($LASTEXITCODE -ne 0) { throw "GET_PIP_FAILED" }

          $nodeVersion="22.23.3"
          $nodeName="node-v$nodeVersion-win-x64.zip"
          $nodeBase="https://nodejs.org/download/release/v$nodeVersion"
          $nodeZip=Join-Path $env:RUNNER_TEMP $nodeName
          $sums=Join-Path $env:RUNNER_TEMP "node-SHASUMS256.txt"
          Invoke-WebRequest -Uri "$nodeBase/$nodeName" -OutFile $nodeZip
          Invoke-WebRequest -Uri "$nodeBase/SHASUMS256.txt" -OutFile $sums
          $expectedLine=Get-Content $sums | Where-Object { $_ -match [regex]::Escape($nodeName) } | Select-Object -First 1
          $nodeExpected=($expectedLine -split '\s+')[0].ToLowerInvariant()
          $nodeSha=(Get-FileHash $nodeZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($nodeSha -ne $nodeExpected) { throw "NODE_SHA256_MISMATCH" }
          $nodeTmp=Join-Path $env:RUNNER_TEMP "node-unpack"
          Expand-Archive $nodeZip $nodeTmp -Force
          $nodeExe=Get-ChildItem $nodeTmp -Recurse -Filter node.exe | Select-Object -First 1
          Copy-Item $nodeExe.FullName "$rt/node/node.exe"

          $meili="$rt/meilisearch/meilisearch-windows-amd64.exe"
          Invoke-WebRequest -Uri "https://github.com/meilisearch/meilisearch/releases/download/v1.54.0/meilisearch-windows-amd64.exe" -OutFile $meili
          $meiliSha=(Get-FileHash $meili -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($meiliSha -ne "1a3a3f2fa249b2a471eca479d37b1d3bbb9bda1aacae3eaf7839218105810125") { throw "MEILI_SHA256_MISMATCH" }

      - name: Build fresh STOUT-1031 Owner package with shadow binary
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $head=(git rev-parse HEAD).Trim()
          & "runtime_input/python/python.exe" "release/issue_199/build_owner_package_stout_1031_r1.py" --repo-root "$PWD" --offline-runtime-root "$PWD/runtime_input" --output "$PWD/APP_CEL_SHADOW_OWNER_R1" --build-head $head --zip
          if ($LASTEXITCODE -ne 0) { throw "OWNER_PACKAGE_BUILD_FAILED" }

      - name: Fresh extract and run offline shadow corpus
        id: winshadow
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $fresh=Join-Path $env:RUNNER_TEMP "app-cel-shadow-owner-fresh"
          if (Test-Path $fresh) { Remove-Item $fresh -Recurse -Force }
          Expand-Archive "APP_CEL_SHADOW_OWNER_R1.zip" $fresh
          $py=Join-Path $fresh "runtime/python/python.exe"
          $cel=Join-Path $fresh "APP_CORE_R3_PILOT/cel_shadow_r1/bin/app-cel-shadow-r1.exe"
          if (-not (Test-Path $cel)) { throw "PACKAGE_CEL_BINARY_MISSING" }
          $env:PIP_NO_INDEX="1"
          $env:PIP_DISABLE_PIP_VERSION_CHECK="1"
          $env:PYTHONNOUSERSITE="1"
          $env:NO_PROXY="*"
          & $py (Join-Path $fresh "APP_CORE_R3_PILOT/cel_shadow_r1/shadow.py") --binary $cel --evidence-dir (Join-Path $fresh "CEL_SHADOW_EVIDENCE") --summary-out "$PWD/WINDOWS_CEL_SHADOW_SUMMARY.json"
          if ($LASTEXITCODE -ne 0) { throw "WINDOWS_SHADOW_FAILED" }
          $s=Get-Content "WINDOWS_CEL_SHADOW_SUMMARY.json" -Raw | ConvertFrom-Json
          "manifest_sha256=$($s.manifest_sha256)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "manifest_count=$($s.manifest_count)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "current_sha256=$($s.current_ledger_sha256)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "cel_sha256=$($s.cel_ledger_sha256)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "parity_percent=$($s.parity.decision_parity_percent)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "unsafe_count=$($s.parity.unsafe_selection_count)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "false_reject_count=$($s.parity.false_reject_count)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "fail_closed=$($s.parity.fail_closed_parity.ToString().ToLowerInvariant())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "deterministic=$($s.deterministic_repeat_pass.ToString().ToLowerInvariant())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Prove Owner no-bootstrap launch still works
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $fresh=Join-Path $env:RUNNER_TEMP "app-cel-shadow-owner-fresh"
          $launcher=Join-Path $fresh "START_STOUT_MACHINE_SELECTION.cmd"
          $launcherText=Get-Content $launcher -Raw
          if ($launcherText.IndexOf("pip install",[System.StringComparison]::OrdinalIgnoreCase) -ge 0) { throw "RUNTIME_PIP_INSTALL_FORBIDDEN" }
          if ($launcherText.IndexOf("Invoke-WebRequest",[System.StringComparison]::OrdinalIgnoreCase) -ge 0) { throw "RUNTIME_DOWNLOAD_FORBIDDEN" }
          $ownerText=Get-Content (Join-Path $fresh "release/issue_169/owner_start.py") -Raw
          if ($ownerText -notmatch '"--no-bootstrap"') { throw "NO_BOOTSTRAP_SEMANTICS_MISSING" }
          $env:PIP_NO_INDEX="1"
          $env:PIP_DISABLE_PIP_VERSION_CHECK="1"
          $env:PYTHONNOUSERSITE="1"
          $proc=Start-Process -FilePath "cmd.exe" -ArgumentList "/c","START_STOUT_MACHINE_SELECTION.cmd > OWNER_CEL_SHADOW.log 2>&1" -WorkingDirectory $fresh -PassThru -WindowStyle Hidden
          $ok=$false
          for ($i=0; $i -lt 180; $i++) {
            Start-Sleep -Seconds 1
            try {
              $h=Invoke-RestMethod -Uri "http://127.0.0.1:8765/health" -TimeoutSec 2
              if ($h) { $ok=$true; break }
            } catch {}
            if ($proc.HasExited) { break }
          }
          if (-not $ok) {
            Get-Content (Join-Path $fresh "OWNER_CEL_SHADOW.log") -ErrorAction SilentlyContinue
            throw "OWNER_OFFLINE_NO_BOOTSTRAP_HEALTH_FAILED"
          }
          $ownerStart=Get-CimInstance Win32_Process | Where-Object { $_.ProcessId -eq $proc.Id }
          Get-CimInstance Win32_Process | Where-Object { $_.ParentProcessId -eq $proc.Id } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $fresh "OWNER_CEL_SHADOW.log") "$PWD/OWNER_CEL_SHADOW.log" -Force
          $s=Get-Content "WINDOWS_CEL_SHADOW_SUMMARY.json" -Raw | ConvertFrom-Json
          [ordered]@{
            schema="APP_CEL_SHADOW_PILOT_R1_WINDOWS_EVIDENCE"
            executed_head=(git rev-parse HEAD).Trim()
            fresh_extract="PASS"
            package_local_runtime="PASS"
            offline_no_bootstrap="PASS"
            runtime_dependency_download="FORBIDDEN_AND_NOT_USED"
            owner_health="PASS"
            current_matcher_authoritative=$true
            cel_shadow="PASS"
            manifest_count=$s.manifest_count
            manifest_sha256=$s.manifest_sha256
            current_ledger_sha256=$s.current_ledger_sha256
            cel_ledger_sha256=$s.cel_ledger_sha256
            decision_parity_percent=$s.parity.decision_parity_percent
            unsafe_selection_count=$s.parity.unsafe_selection_count
            false_reject_count=$s.parity.false_reject_count
            fail_closed_parity=$s.parity.fail_closed_parity
            deterministic_repeat_pass=$s.deterministic_repeat_pass
            performance=$s.performance
          } | ConvertTo-Json -Depth 12 | Set-Content "WINDOWS_CEL_SHADOW_EVIDENCE.json" -Encoding utf8
          Get-Content "WINDOWS_CEL_SHADOW_EVIDENCE.json"



  windows_web_parity:
    name: Windows Web CEL shadow parity
    needs:
      - web_shadow
      - windows_owner_shadow
    runs-on: ubuntu-latest
    steps:
      - name: Public carrier provenance
        run: |
          echo "PUBLIC_CI_CARRIER=nalsur0609/1234"
          echo "SOURCE_HEAD=$SOURCE_HEAD"
          echo "ARTIFACT_RETENTION=NONE"
      - name: Compare exact shadow result corpus
        shell: bash
        env:
          WEB_MANIFEST: ${{ needs.web_shadow.outputs.manifest_sha256 }}
          WIN_MANIFEST: ${{ needs.windows_owner_shadow.outputs.manifest_sha256 }}
          WEB_COUNT: ${{ needs.web_shadow.outputs.manifest_count }}
          WIN_COUNT: ${{ needs.windows_owner_shadow.outputs.manifest_count }}
          WEB_CURRENT: ${{ needs.web_shadow.outputs.current_sha256 }}
          WIN_CURRENT: ${{ needs.windows_owner_shadow.outputs.current_sha256 }}
          WEB_CEL: ${{ needs.web_shadow.outputs.cel_sha256 }}
          WIN_CEL: ${{ needs.windows_owner_shadow.outputs.cel_sha256 }}
          WEB_PARITY: ${{ needs.web_shadow.outputs.parity_percent }}
          WIN_PARITY: ${{ needs.windows_owner_shadow.outputs.parity_percent }}
          WEB_UNSAFE: ${{ needs.web_shadow.outputs.unsafe_count }}
          WIN_UNSAFE: ${{ needs.windows_owner_shadow.outputs.unsafe_count }}
          WEB_FALSE: ${{ needs.web_shadow.outputs.false_reject_count }}
          WIN_FALSE: ${{ needs.windows_owner_shadow.outputs.false_reject_count }}
          WEB_FAIL: ${{ needs.web_shadow.outputs.fail_closed }}
          WIN_FAIL: ${{ needs.windows_owner_shadow.outputs.fail_closed }}
          WEB_DET: ${{ needs.web_shadow.outputs.deterministic }}
          WIN_DET: ${{ needs.windows_owner_shadow.outputs.deterministic }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          assert os.environ["WEB_MANIFEST"] == os.environ["WIN_MANIFEST"] and os.environ["WEB_MANIFEST"]
          assert os.environ["WEB_COUNT"] == os.environ["WIN_COUNT"] and int(os.environ["WEB_COUNT"]) > 0
          assert os.environ["WEB_CURRENT"] == os.environ["WIN_CURRENT"]
          assert os.environ["WEB_CEL"] == os.environ["WIN_CEL"]
          assert float(os.environ["WEB_PARITY"]) == float(os.environ["WIN_PARITY"]) == 100.0
          assert int(os.environ["WEB_UNSAFE"]) == int(os.environ["WIN_UNSAFE"]) == 0
          assert int(os.environ["WEB_FALSE"]) == int(os.environ["WIN_FALSE"]) == 0
          assert os.environ["WEB_FAIL"] == os.environ["WIN_FAIL"] == "true"
          assert os.environ["WEB_DET"] == os.environ["WIN_DET"] == "true"
          value={
              "schema":"APP_CEL_SHADOW_PILOT_R1_WINDOWS_WEB_PARITY",
              "result":"PASS",
              "manifest_count":int(os.environ["WEB_COUNT"]),
              "manifest_sha256":os.environ["WEB_MANIFEST"],
              "current_ledger_sha256":os.environ["WEB_CURRENT"],
              "cel_ledger_sha256":os.environ["WEB_CEL"],
              "decision_parity_percent":100.0,
              "unsafe_selection_count":0,
              "false_reject_count":0,
              "fail_closed_parity":True,
              "deterministic_repeat_pass":True,
          }
          open("WINDOWS_WEB_CEL_SHADOW_PARITY.json","w",encoding="utf-8").write(json.dumps(value,ensure_ascii=False,indent=2,sort_keys=True)+"\n")
          print(json.dumps(value,ensure_ascii=False,indent=2,sort_keys=True))
          PY

